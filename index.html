<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANONIC</title>
    <link rel="stylesheet" href="/DESIGN.css?v=1">
    <style>
        body { background: #0a0a0a; color: #e0e0e0; font-family: system-ui, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .org-root { text-align: center; }
        .org-mark { font-size: 4rem; margin-bottom: 1rem; }
        .org-label { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.15em; margin-bottom: 2rem; }
        .users { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
        .user-link { display: block; padding: 1.5rem 2.5rem; border: 1px solid #333; border-radius: 8px; text-decoration: none; color: #e0e0e0; font-weight: 600; letter-spacing: 0.1em; transition: border-color 0.2s; }
        .user-link:hover { border-color: #00ff88; color: #00ff88; }
        .user-link .scope { font-size: 0.75rem; opacity: 0.5; display: block; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div class="org-root">
        <div class="org-mark">&cap;</div>
        <div class="org-label">CANONIC</div>
        <div class="users">
            <a class="user-link" href="/FOUNDATION/">FOUNDATION<span class="scope">Certification</span></a>
            <a class="user-link" href="/INDUSTRIES/">INDUSTRIES<span class="scope">Governed Domains</span></a>
            <a class="user-link" href="/MAGIC/">MAGIC<span class="scope">Operations Platform</span></a>
        </div>
    </div>
</body>
</html>
