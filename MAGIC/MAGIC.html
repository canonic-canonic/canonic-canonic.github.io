<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAGIC — Galaxy</title>
    <meta name="description" content="The CANONIC governance Galaxy. Every scope. Every dimension. One view.">
    <!-- No external dependencies. Native DOM Finder. Same contract: web / iOS / Android. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #000; --fg: #f5f5f7; --dim: #86868b;
            --panel: rgba(28,28,30,0.95); --border: rgba(255,255,255,0.08);
            --glass-hover: rgba(255,255,255,0.06);
            --mono: 'SF Mono', 'Menlo', 'Monaco', monospace;
        }

        body { background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; height: 100vh; }

        /* ═══ GALAXY (full viewport scrollable Finder) ═══ */
        #galaxy {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow-y: auto; padding: 80px 36px 100px;
        }
        #galaxy::-webkit-scrollbar { width: 4px; }
        #galaxy::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* ═══ BREADCRUMBS ═══ */
        .breadcrumbs {
            margin-bottom: 20px;
            font-family: var(--mono); font-size: 12px;
        }
        .crumb {
            color: var(--dim); cursor: pointer;
            transition: color 0.2s;
        }
        .crumb:hover { color: var(--fg); }
        .crumb-active { color: var(--fg); font-weight: 700; cursor: default; }
        .crumb-sep { color: rgba(255,255,255,0.2); }

        /* ═══ SCOPE HEADER ═══ */
        .scope-header { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .scope-header-kind {
            font-family: var(--mono); font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em;
        }
        .scope-header-title {
            font-size: 32px; font-weight: 800; letter-spacing: 0.04em;
            text-transform: uppercase; margin: 4px 0 8px;
        }
        .scope-header-sub {
            font-family: var(--mono); font-size: 11px; color: var(--dim);
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .scope-connections { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .conn-label { font-family: var(--mono); font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
        .conn-tag {
            font-family: var(--mono); font-size: 10px; font-weight: 600;
            padding: 3px 10px; border: 1px solid; border-radius: 12px;
            cursor: pointer; transition: background 0.2s;
        }
        .conn-tag:hover { background: var(--glass-hover); }

        /* ═══ SCOPE GRID ═══ */
        .scope-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        /* ═══ SCOPE CARD ═══ */
        .scope-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent, #64748b);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.3s, box-shadow 0.3s;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
        }
        .scope-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .scope-card:active { transform: translateY(0); }

        /* ORG cards glow */
        .kind-org {
            border-left-width: 4px;
            box-shadow: 0 0 20px rgba(255,214,10,0.08);
        }
        .kind-org:hover { box-shadow: 0 0 40px rgba(255,214,10,0.15); }

        /* SERVICE cards */
        .kind-service { border-left-color: #ec4899; }
        .kind-service:hover { box-shadow: 0 4px 20px rgba(236,72,153,0.1); }

        /* DEAL cards */
        .kind-deal { border-left-color: #ff9f0a; }

        /* VERTICAL cards */
        .kind-vertical { border-left-color: #bf5af2; }

        /* USER cards */
        .kind-user { opacity: 0.85; }
        .kind-user:hover { opacity: 1; }

        .card-top {
            display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
        }
        .card-icon { font-size: 14px; }
        .card-kind {
            font-family: var(--mono); font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        .card-conn-badge {
            margin-left: auto;
            font-family: var(--mono); font-size: 9px; color: #00ff88;
            opacity: 0.7;
        }
        .card-label {
            font-size: 16px; font-weight: 700; letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .card-meta {
            margin-top: 6px;
            font-family: var(--mono); font-size: 10px; color: var(--dim);
            text-transform: uppercase; letter-spacing: 0.04em;
        }

        /* ═══ LEAF DETAIL ═══ */
        .leaf-detail { max-width: 500px; }
        .leaf-row {
            display: flex; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid var(--border);
        }
        .leaf-row:last-child { border: none; }
        .leaf-key { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .leaf-val { font-family: var(--mono); font-size: 11px; text-align: right; word-break: break-all; }
        .leaf-section { margin-top: 20px; }
        .leaf-section-title {
            font-size: 10px; color: var(--dim); text-transform: uppercase;
            letter-spacing: 0.1em; margin-bottom: 10px;
        }
        .leaf-edge {
            font-family: var(--mono); font-size: 11px;
            padding: 6px 0; cursor: pointer;
        }
        .leaf-edge:hover { text-decoration: underline; }

        /* ═══ SECTION LABEL ═══ */
        .section-label {
            font-family: var(--mono); font-size: 11px; color: var(--dim);
            text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px;
        }

        /* ═══ SEARCH ═══ */
        .search {
            position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
            width: 280px; padding: 10px 16px;
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            color: var(--fg); font-family: var(--mono); font-size: 12px;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            outline: none; transition: width 0.3s, border-color 0.3s; z-index: 100;
        }
        .search:focus { width: 400px; border-color: rgba(0,255,136,0.3); }
        .search::placeholder { color: var(--dim); }

        /* ═══ HUD (top-left) ═══ */
        .hud { position: fixed; top: 28px; left: 36px; z-index: 100; text-align: center; }
        .hud-label { font-family: var(--mono); font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 8px; }

        /* ═══ DETAIL PANEL (right) ═══ */
        .detail-panel {
            position: fixed; right: -380px; top: 50%; transform: translateY(-50%);
            width: 340px; max-height: 80vh; overflow-y: auto;
            background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            z-index: 100; transition: right 0.3s ease;
        }
        .detail-panel.open { right: 36px; }
        .detail-panel::-webkit-scrollbar { width: 4px; }
        .detail-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .dp-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 12px; border-bottom: 1px solid var(--border); }
        .dp-name { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
        .dp-close { background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; padding: 4px 8px; }
        .dp-close:hover { color: var(--fg); }

        /* ═══ DOCK (bottom-center) ═══ */
        .dock {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(28,28,30,0.7); border: 1px solid var(--border); border-radius: 20px;
            padding: 8px 16px; display: flex; gap: 4px; align-items: center;
            -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); z-index: 100;
        }
        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 8px 12px; border-radius: 12px; cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
            text-decoration: none; color: var(--fg);
        }
        .dock-item:hover { transform: scale(1.35) translateY(-8px); background: var(--glass-hover); }
        .dock-glyph { font-size: 24px; }
        .dock-label { font-family: var(--mono); font-size: 7px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
        .dock-sep { width: 1px; height: 32px; background: var(--border); margin: 0 4px; }

        /* ═══ BACK LINK ═══ */
        .back { position: fixed; top: 28px; right: 36px; font-family: var(--mono); font-size: 11px; color: var(--dim); text-decoration: none; z-index: 100; padding: 8px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
        .back:hover { color: #00ff88; border-color: rgba(0,255,136,0.3); }

        @media (max-width: 768px) {
            .detail-panel { width: 100%; right: -100%; top: auto; bottom: 0; transform: none; max-height: 60vh; border-radius: 16px 16px 0 0; }
            .detail-panel.open { right: 0; }
            .search { width: 200px; }
            .search:focus { width: 280px; }
            .hud { top: auto; bottom: 80px; left: 16px; }
            #galaxy { padding: 70px 16px 100px; }
            .scope-grid { grid-template-columns: 1fr; }
            .scope-header-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- Galaxy Finder (full viewport scrollable) -->
    <div id="galaxy"></div>

    <!-- Search -->
    <input type="text" class="search" id="galaxySearch" placeholder="/ SEARCH SCOPES" autocomplete="off">

    <!-- HUD (scope counts) -->
    <div class="hud" id="hud"></div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detailPanel"></div>

    <!-- Dock -->
    <div class="dock">
        <a class="dock-item" href="./">
            <span class="dock-glyph">&#8745;</span>
            <span class="dock-label">MAGIC</span>
        </a>
        <div class="dock-sep"></div>
        <a class="dock-item" href="magic://canonic-canonic/FOUNDATION">
            <span class="dock-glyph">&#128220;</span>
            <span class="dock-label">Foundation</span>
        </a>
        <a class="dock-item" href="https://hadleylab-dexter.github.io">
            <span class="dock-glyph">&#129516;</span>
            <span class="dock-label">Hadley Lab</span>
        </a>
        <a class="dock-item" href="#" onclick="if(typeof TALK!=='undefined')TALK.open();return false">
            <span class="dock-glyph">&#128172;</span>
            <span class="dock-label">TALK</span>
        </a>
    </div>

    <!-- Back to MAGIC home -->
    <a class="back" href="./">ESC &rarr; MAGIC</a>

    <script src="./magic.js"></script>
    <script>GALAXY.init();</script>
</body>
</html>
