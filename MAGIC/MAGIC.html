<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAGIC — Galaxy</title>
    <meta name="description" content="The CANONIC governance Galaxy. Every scope. Every dimension. One view.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1e1e1e; --bg-alt: #252526; --fg: #cccccc; --fg-bright: #e8e8e8;
            --dim: #6a6a6a; --accent: #007aff; --accent-dim: rgba(0,122,255,0.15);
            --border: rgba(255,255,255,0.06); --hover: rgba(255,255,255,0.04);
            --selected: rgba(0,122,255,0.25); --selected-border: rgba(0,122,255,0.4);
            --panel: rgba(30,30,30,0.97);
            --mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', system-ui, sans-serif;
            --row-h: 28px;
        }

        html, body { background: var(--bg); color: var(--fg); font-family: var(--sans);
            font-size: 13px; -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh;
            -webkit-user-select: none; user-select: none;
        }

        /* ═══ FINDER CONTAINER ═══ */
        #galaxy {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow-y: auto; padding: 56px 0 80px;
        }
        #galaxy::-webkit-scrollbar { width: 8px; }
        #galaxy::-webkit-scrollbar-track { background: transparent; }
        #galaxy::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; border: 2px solid var(--bg); }
        #galaxy::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* ═══ TOOLBAR ═══ */
        .toolbar {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 20px; border-bottom: 1px solid var(--border);
            background: var(--bg); position: sticky; top: 0; z-index: 10;
        }
        .tb-btn {
            font-family: var(--sans); font-size: 11px; color: var(--dim);
            background: none; border: 1px solid var(--border); border-radius: 4px;
            padding: 3px 10px; cursor: pointer; transition: all 0.15s;
        }
        .tb-btn:hover { color: var(--fg); border-color: rgba(255,255,255,0.15); background: var(--hover); }
        .tb-count { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: auto; }

        /* ═══ COLUMN HEADERS ═══ */
        .col-headers {
            display: flex; align-items: center;
            padding: 0 20px; height: 22px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-alt); position: sticky; top: 33px; z-index: 9;
        }
        .col-header {
            font-family: var(--mono); font-size: 10px; font-weight: 600;
            color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em;
            padding: 0 8px; white-space: nowrap; overflow: hidden;
        }
        .col-header:hover { color: var(--fg); }
        .col-active { color: var(--fg-bright); }

        /* ═══ TREE ═══ */
        .tree { min-width: 100%; }

        /* ═══ ROW ═══ */
        .tree-row {
            display: flex; align-items: center;
            height: var(--row-h); padding: 0 20px;
            cursor: default; transition: background 0.08s;
            border-bottom: 1px solid transparent;
        }
        .tree-row:nth-child(even) { background: rgba(255,255,255,0.015); }
        .tree-row:hover { background: var(--hover); }
        .row-selected {
            background: var(--selected) !important;
            border-bottom-color: var(--selected-border);
        }
        .row-dim { opacity: 0.3; }

        /* ═══ CELLS ═══ */
        .cell {
            display: flex; align-items: center; gap: 4px;
            font-size: 12px; padding: 0 8px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            min-width: 0;
        }
        .cell-name { gap: 0; }
        .cell-cat, .cell-num { font-family: var(--mono); font-size: 11px; color: var(--dim); }

        /* Indent spacer */
        .indent { display: inline-block; flex-shrink: 0; }

        /* Chevron */
        .chevron {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; flex-shrink: 0;
            font-size: 8px; color: var(--dim); transition: color 0.15s;
        }
        .chevron-active { cursor: pointer; }
        .chevron-active:hover { color: var(--fg-bright); }

        /* Icon */
        .row-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; flex-shrink: 0;
            font-size: 11px;
        }

        /* Label */
        .row-label {
            font-size: 12px; font-weight: 500;
            color: var(--fg-bright); letter-spacing: 0.01em;
            overflow: hidden; text-overflow: ellipsis;
        }
        .row-highlight {
            background: rgba(255,214,10,0.2); border-radius: 2px;
            padding: 0 3px; margin: 0 -3px;
        }

        /* Kind badge */
        .kind-badge {
            font-family: var(--mono); font-size: 9px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.06em;
            padding: 1px 6px; border: 1px solid; border-radius: 3px;
        }

        /* Connection tags */
        .conn-tag {
            font-family: var(--mono); font-size: 9px; font-weight: 500;
            padding: 1px 6px; border: 1px solid; border-radius: 3px;
            cursor: pointer; transition: background 0.15s;
            display: inline-block; margin-right: 3px;
        }
        .conn-tag:hover { background: var(--hover); }

        /* ═══ SEARCH ═══ */
        .search {
            position: fixed; top: 0; left: 0; right: 0;
            width: 100%; height: 36px; padding: 0 20px;
            background: var(--bg-alt); border: none; border-bottom: 1px solid var(--border);
            color: var(--fg); font-family: var(--sans); font-size: 13px;
            outline: none; z-index: 20;
        }
        .search:focus { background: #2a2a2c; }
        .search::placeholder { color: var(--dim); }

        /* ═══ HUD (top-right, inside search bar) ═══ */
        .hud {
            position: fixed; top: 0; right: 20px; height: 36px;
            display: flex; align-items: center; gap: 12px; z-index: 21;
        }
        .hud-label { font-family: var(--mono); font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }

        /* ═══ DETAIL PANEL ═══ */
        .detail-panel {
            position: fixed; right: -380px; top: 36px; bottom: 60px;
            width: 340px; overflow-y: auto;
            background: var(--panel); border-left: 1px solid var(--border);
            z-index: 15; transition: right 0.2s ease;
        }
        .detail-panel.open { right: 0; }
        .detail-panel::-webkit-scrollbar { width: 6px; }
        .detail-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .dp-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; background: var(--panel); z-index: 1;
        }
        .dp-name { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
        .dp-close { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .dp-close:hover { color: var(--fg); background: var(--hover); }

        .dp-body { padding: 12px 20px 20px; }
        .dp-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: 1px solid var(--border);
        }
        .dp-row:last-child { border: none; }
        .dp-key { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
        .dp-val { font-family: var(--mono); font-size: 11px; text-align: right; word-break: break-all; color: var(--fg-bright); }

        .dp-section { margin-top: 14px; }
        .dp-section-title {
            font-family: var(--mono); font-size: 9px; color: var(--dim);
            text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px;
            padding-bottom: 4px; border-bottom: 1px solid var(--border);
        }
        .dp-edge {
            font-family: var(--mono); font-size: 11px; color: var(--fg);
            padding: 4px 0; cursor: pointer;
        }
        .dp-edge:hover { color: var(--fg-bright); text-decoration: underline; }

        /* ═══ DOCK ═══ */
        .dock {
            position: fixed; bottom: 0; left: 0; right: 0; height: 48px;
            background: var(--bg-alt); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; gap: 2px;
            z-index: 20;
        }
        .dock-item {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 6px; cursor: pointer;
            transition: background 0.15s;
            text-decoration: none; color: var(--fg);
            font-size: 12px;
        }
        .dock-item:hover { background: var(--hover); }
        .dock-glyph { font-size: 16px; }
        .dock-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); }
        .dock-sep { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }

        @media (max-width: 768px) {
            .detail-panel { width: 100%; right: -100%; top: auto; bottom: 48px; max-height: 50vh; border-left: none; border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
            .detail-panel.open { right: 0; }
            .col-headers, .cell-cat, .cell-num { display: none; }
            .cell-conn .conn-tag { display: none; }
            .cell-conn::after { content: ''; }
        }
    </style>
</head>
<body>
    <!-- Search (full-width, top) -->
    <input type="text" class="search" id="galaxySearch" placeholder="Search scopes..." autocomplete="off">

    <!-- HUD -->
    <div class="hud" id="hud"></div>

    <!-- Finder Tree -->
    <div id="galaxy"></div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detailPanel"></div>

    <!-- Dock (bottom bar) -->
    <div class="dock">
        <a class="dock-item" href="./">
            <span class="dock-glyph">&#8745;</span>
            <span class="dock-label">MAGIC</span>
        </a>
        <div class="dock-sep"></div>
        <a class="dock-item" href="#" onclick="GALAXY.nav('canonic-canonic/FOUNDATION');return false">
            <span class="dock-glyph">&#128220;</span>
            <span class="dock-label">Foundation</span>
        </a>
        <a class="dock-item" href="#" onclick="GALAXY.nav('hadleylab-canonic');return false">
            <span class="dock-glyph">&#129516;</span>
            <span class="dock-label">Hadley Lab</span>
        </a>
        <a class="dock-item" href="#" onclick="GALAXY.nav('hadleylab-canonic/DEXTER/SERVICES/TALK');return false">
            <span class="dock-glyph">&#128172;</span>
            <span class="dock-label">TALK</span>
        </a>
    </div>

    <script src="./magic.js?v=3"></script>
    <script>GALAXY.init();</script>
</body>
</html>
